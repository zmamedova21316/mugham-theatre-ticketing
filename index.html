<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baku Mugham Theatre – Ticket Selection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <h1>Baku Mugham Theatre</h1>
    <p class="subtitle">Select your seats</p>
    <p class="summary" id="venue-summary"></p>
  </header>
    <section class="map-panel" aria-label="Venue map">
      <ul class="legend" aria-label="Legend">
        <li><span class="swatch seat available"></span> Available</li>
        <li><span class="swatch seat inspected"></span> Selected</li>
        <li><span class="swatch seat in-cart"></span> In cart</li>
        <li><span class="swatch seat unavailable"></span> Unavailable</li>
      </ul>
      <ul class="price-legend" id="price-legend" aria-label="Price categories"></ul>

    
      <div class="viewport" id="viewport">
        <div class="hall" id="hall"></div>
      </div>
    </section>

   
    <aside class="side-panel">
      <section class="card" aria-live="polite">
        <h2>Seat details</h2>
        <div id="seat-details">
          <p class="muted">Click a seat to see its details.</p>
        </div>
        <button id="add-to-cart" class="btn primary" disabled>ADD TO CART</button>
      </section>

      <section class="card">
        <h2>Your cart</h2>
        <ul id="cart-list" class="cart-list">
          <li class="muted">Your cart is empty.</li>
        </ul>
        <p class="total">Total: <strong id="cart-total">0</strong> AZN</p>
      </section>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
